<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore all the products that match your search." />
    <title>Search results | Modern Market</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="products.js" defer></script>
    <script src="store.js" defer></script>
    <script src="results.js" defer></script>
  </head>
  <body class="shop-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Modern Market home">modern<span>market</span></a>
      <div class="cart-indicator" aria-label="Shopping cart">
        <span>Cart</span>
        <span id="cartCount" class="cart-count">0</span>
      </div>
    </header>
    <main class="shop-main">
      <a class="back-link" href="index.html">← New search</a>
      <section class="results-page" aria-labelledby="resultsTitle">
        <p class="eyebrow">Your search</p>
        <h1 id="resultsTitle">Matching products</h1>
        <p id="resultsDescription" class="results-description"></p>
        <div id="productResults" class="results-grid"></div>
      </section>
    </main>
    <footer class="site-footer">
      <p>Less scrolling. More finding.</p>
      <p id="cartSummary">Your cart is empty.</p>
    </footer>
  </body>
</html>
