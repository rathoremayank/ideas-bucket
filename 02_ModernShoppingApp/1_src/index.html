<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tell Modern Market what you need. Answer two quick questions to find a few thoughtful matches."
    />
    <title>Modern Market | Find what you need</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Modern Market home">modern<span>market</span></a>
      <div class="cart-indicator" aria-label="Shopping cart">
        <span>Cart</span>
        <span id="cartCount" class="cart-count">0</span>
      </div>
    </header>

    <main>
      <section class="experience" aria-labelledby="welcomeTitle">
        <div class="intro">
          <p class="eyebrow">A more thoughtful way to shop</p>
          <h1 id="welcomeTitle">What are you looking for?</h1>
          <p>Tell us a little about what you need. We’ll find a few good options, not an endless list.</p>
        </div>

        <form id="searchForm" class="search-form" role="search">
          <label class="visually-hidden" for="productSearch">What do you want to buy?</label>
          <input
            id="productSearch"
            name="search"
            type="search"
            placeholder="Try “a mug for my morning coffee”"
            autocomplete="off"
            required
          />
          <button class="primary-button" type="submit">Find my match <span aria-hidden="true">→</span></button>
        </form>

        <p class="search-hint">A product, a purpose, or even just a feeling.</p>

        <section id="questions" class="questions" aria-live="polite" hidden></section>
        <section id="results" class="results" aria-live="polite" hidden></section>
      </section>
    </main>

    <footer class="site-footer">
      <p>Less scrolling. More finding.</p>
      <p id="cartSummary">Your cart is empty.</p>
    </footer>
  </body>
</html>
